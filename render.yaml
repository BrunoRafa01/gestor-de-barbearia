# ---------------------------------------------------------------------------
# Gestor de Barbearia - Nova Runtime
# Render Blueprint (Infrastructure as Code).
#
# Como usar:
#   1. Suba este projeto para um repositorio no GitHub.
#   2. No Render, clique em "New > Blueprint" e escolha o repositorio.
#   3. Informe TURSO_DATABASE_URL e TURSO_AUTH_TOKEN quando solicitado.
#   4. O Render cria o servico, o HTTPS e o dominio *.onrender.com automaticamente.
#
# Por que Turso? O disco do plano gratuito do Render e efemero
# (some a cada deploy/reinicio), entao o banco fica na nuvem do Turso (gratuito).
# ---------------------------------------------------------------------------

services:
  - type: web
    name: gestor-de-barbearia
    runtime: node
    plan: free
    region: oregon
    branch: main
    autoDeploy: true
    buildCommand: npm install --include=dev && npm run build
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: HOST
        value: 0.0.0.0
      - key: TZ
        value: America/Fortaleza
      - key: TRUST_PROXY
        value: "true"
      # Senha inicial do painel: o Render gera um valor forte automaticamente.
      # Veja em: Dashboard do servico > Environment > ADMIN_PASSWORD.
      - key: ADMIN_PASSWORD
        generateValue: true
      # Chave de assinatura HMAC das sessoes gerada automaticamente
      - key: SESSION_SECRET
        generateValue: true
      # Banco persistente na nuvem (Turso/libSQL). Preencha no dashboard.
      - key: TURSO_DATABASE_URL
        sync: false
      - key: TURSO_AUTH_TOKEN
        sync: false
      # Segredo da Meta para validar X-Hub-Signature-256 no webhook do WhatsApp
      - key: WHATSAPP_APP_SECRET
        sync: false
      # Login administrativo com Google OAuth 2.0 (opcional)
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: ADMIN_ALLOWED_EMAILS
        sync: false
      - key: OAUTH_ALLOW_SIGNUP
        value: "false"
      - key: MASTER_ALLOWED_EMAILS
        sync: false
