<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#090B10" />
    <title>Agendar horario | Gestor de Barbearia</title>
    <meta
      name="description"
      content="Agende seu horario online na barbearia. Escolha servico, profissional e horario em poucos toques."
    />
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%23090B10' stroke='%233B82F6' stroke-width='2'/%3E%3Ctext x='16' y='21.5' font-size='13' font-family='sans-serif' font-weight='700' fill='%2360A5FA' text-anchor='middle'%3EGB%3C/text%3E%3C/svg%3E"
    />
    <link rel="stylesheet" href="/css/app.css" />
  </head>
  <body>
    <div class="booking-page">
      <header class="booking-header">
        <div class="brand">
          <div class="brand-mark">GB</div>
          <div class="brand-text">
            <strong id="shop-name">Gestor de Barbearia</strong>
            <span id="shop-company">Nova Runtime</span>
          </div>
        </div>
        <h1 id="shop-title">Agende seu horario</h1>
        <p id="shop-sub">Escolha o servico, o profissional e o melhor horario.</p>
        <div class="demo-badge hidden" id="demo-badge">Modo demonstracao - dados ficticios</div>
        <div class="booking-contact" id="shop-contact"></div>
      </header>

      <main class="booking-main">
        <div class="steps" id="steps">
          <span class="active" data-step="1"><b>1</b> Servico</span>
          <span data-step="2"><b>2</b> Profissional</span>
          <span data-step="3"><b>3</b> Horario</span>
          <span data-step="4"><b>4</b> Seus dados</span>
        </div>
        <div id="booking-content">
          <div class="empty"><div class="spinner" style="margin:0 auto 12px"></div>Carregando...</div>
        </div>
      </main>
    </div>

    <noscript>
      <div class="page-centered">
        <div class="auth-card">
          <h1 class="gold">Gestor de Barbearia</h1>
          <p class="muted" style="margin-top:10px">Ative o JavaScript para agendar pelo celular.</p>
        </div>
      </div>
    </noscript>

    <script type="module" src="/js/agendar.js"></script>
  </body>
</html>
