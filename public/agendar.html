<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#0F1014" />
    <title>Agendar horário | Gestor de Barbearia</title>
    <meta
      name="description"
      content="Agende seu horário online na barbearia. Escolha serviço, profissional e horário em poucos toques."
    />
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%230F1014' stroke='%23D4AF37' stroke-width='2'/%3E%3Ccircle cx='10' cy='10' r='3' fill='none' stroke='%23F59E0B' stroke-width='1.8'/%3E%3Ccircle cx='10' cy='22' r='3' fill='none' stroke='%23F59E0B' stroke-width='1.8'/%3E%3Cline x1='24' y1='8' x2='12' y2='20' stroke='%23F59E0B' stroke-width='1.8' stroke-linecap='round'/%3E%3Cline x1='18' y1='18' x2='24' y2='24' stroke='%23F59E0B' stroke-width='1.8' stroke-linecap='round'/%3E%3Cline x1='12' y1='12' x2='15.5' y2='15.5' stroke='%23F59E0B' stroke-width='1.8' stroke-linecap='round'/%3E%3C/svg%3E"
    />
    <link rel="stylesheet" href="/css/app.css" />
  </head>
  <body>
    <div class="barber-pole-strip"></div>
    <div class="booking-page">
      <header class="booking-header">
        <div class="brand">
          <div class="brand-mark" aria-hidden="true">
            <svg viewBox="0 0 32 32" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <circle cx="8" cy="8" r="3"/>
              <circle cx="8" cy="24" r="3"/>
              <line x1="26" y1="6" x2="10.5" y2="21.5"/>
              <line x1="18.5" y1="18.5" x2="26" y2="26"/>
              <line x1="10.5" y1="10.5" x2="15" y2="15"/>
              <circle cx="15.5" cy="15.5" r="1.5" fill="currentColor"/>
            </svg>
          </div>
          <div class="brand-text">
            <strong id="shop-name">Gestor de Barbearia</strong>
            <span id="shop-company">Cortes &amp; Barba Tradicional</span>
          </div>
        </div>
        <h1 id="shop-title">Agende seu horário</h1>
        <p id="shop-sub">Escolha o serviço, o profissional e o melhor horário.</p>

        <div class="barber-features">
          <span class="barber-badge">✂ Atendimento Pontual</span>
          <span class="barber-badge">♨ Toalha Quente</span>
          <span class="barber-badge">☕ Café Cortesia</span>
        </div>

        <div class="demo-badge hidden" id="demo-badge">Modo demonstração — dados fictícios</div>
        <div class="booking-contact" id="shop-contact"></div>
      </header>

      <main class="booking-main">
        <div class="steps" id="steps">
          <span class="active" data-step="1"><b>1</b> Serviço</span>
          <span data-step="2"><b>2</b> Profissional</span>
          <span data-step="3"><b>3</b> Horário</span>
          <span data-step="4"><b>4</b> Seus dados</span>
        </div>
        <div id="booking-content">
          <div class="empty"><div class="spinner" style="margin:0 auto 12px"></div>Carregando...</div>
        </div>
      </main>
    </div>

    <noscript>
      <div class="page-centered">
        <div class="auth-card">
          <h1 class="gold">Gestor de Barbearia</h1>
          <p class="muted" style="margin-top:10px">Ative o JavaScript para agendar pelo celular.</p>
        </div>
      </div>
    </noscript>

    <script type="module" src="/js/agendar.js"></script>
  </body>
</html>
