<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 340" width="100%" height="100%">
  <defs>
    <!-- Gradiente de fundo escuro estilo Blueprint Noir -->
    <radialGradient id="bgGrad" cx="50%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#111827"/>
      <stop offset="45%" stop-color="#0B0F19"/>
      <stop offset="100%" stop-color="#04060A"/>
    </radialGradient>
    <radialGradient id="glowGrad" cx="50%" cy="40%" r="40%">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#38BDF8" stop-opacity="0"/>
    </radialGradient>

    <!-- Padrao de Grid Tech -->
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#38BDF8" stroke-width="0.75" stroke-opacity="0.07"/>
    </pattern>

    <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.7"/>
    </filter>
  </defs>

  <!-- Moldura Principal com cantos arredondados -->
  <g filter="url(#shadow)">
    <rect x="10" y="10" width="980" height="320" rx="20" fill="url(#bgGrad)" stroke="#1E293B" stroke-width="1.5"/>
    <rect x="10" y="10" width="980" height="320" rx="20" fill="url(#grid)"/>
    <circle cx="500" cy="140" r="300" fill="url(#glowGrad)"/>
  </g>

  <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" text-anchor="middle">
    <!-- Badge Superior: ECOSSISTEMA -->
    <g transform="translate(500, 48)">
      <rect x="-115" y="-14" width="230" height="28" rx="14" fill="#0F172A" stroke="#38BDF8" stroke-width="1.2" stroke-opacity="0.4"/>
      <text y="4" font-size="10.5" font-weight="700" fill="#38BDF8" letter-spacing="3.5">NOVA RUNTIME ECOSYSTEM</text>
    </g>

    <!-- Titulo Principal -->
    <text x="500" y="132" font-size="46" font-weight="850" fill="#FFFFFF" letter-spacing="1.5">
      GESTOR DE BARBEARIA
    </text>

    <!-- Subtitulo -->
    <text x="500" y="170" font-size="16" font-weight="400" fill="#94A3B8" letter-spacing="0.3">
      Plataforma SaaS Profissional de Agendamento Inteligente &amp; Gestão de Barbearia
    </text>

    <!-- 4 Pills Inferiores com Tecnologia e Pilares -->
    <g transform="translate(500, 240)">
      <!-- Pill 1: Node & TS -->
      <g transform="translate(-360, 0)">
        <rect x="-110" y="-19" width="220" height="38" rx="10" fill="#0B101D" stroke="#1E293B" stroke-width="1.2"/>
        <text y="5" font-size="12.5" font-weight="600" fill="#E2E8F0">Node.js 22 &amp; TypeScript</text>
      </g>

      <!-- Pill 2: SQLite & Turso -->
      <g transform="translate(-120, 0)">
        <rect x="-110" y="-19" width="220" height="38" rx="10" fill="#0B101D" stroke="#1E293B" stroke-width="1.2"/>
        <text y="5" font-size="12.5" font-weight="600" fill="#E2E8F0">SQLite &amp; Turso LibSQL</text>
      </g>

      <!-- Pill 3: PWA Mobile & iOS -->
      <g transform="translate(120, 0)">
        <rect x="-110" y="-19" width="220" height="38" rx="10" fill="#0B101D" stroke="#1E293B" stroke-width="1.2"/>
        <text y="5" font-size="12.5" font-weight="600" fill="#E2E8F0">PWA Mobile &amp; iOS Nativo</text>
      </g>

      <!-- Pill 4: Blindado -->
      <g transform="translate(360, 0)">
        <rect x="-110" y="-19" width="220" height="38" rx="10" fill="#0B101D" stroke="#1E293B" stroke-width="1.2"/>
        <text y="5" font-size="12.5" font-weight="600" fill="#E2E8F0">100% Blindado Concorrência</text>
      </g>
    </g>
  </g>
</svg>
